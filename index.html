<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipta Guru Asesmen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234F46E5'/><text y='22' x='8' font-size='18' font-family='serif' font-weight='bold' fill='white'>A</text></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --p:#4F46E5; --p2:#7C3AED; --ink:#0F172A; --mut:#64748b; --line:#E5E3F0; --bg:#F8F7FF; --ok:#10B981; --warn:#F59E0B; --bad:#EF4444; }
html, body { font-family:'Plus Jakarta Sans',sans-serif; -webkit-font-smoothing:antialiased; background:var(--bg); color:var(--ink); min-height:100%; }
h1,h2,h3,.disp { font-family:'Bricolage Grotesque',sans-serif; letter-spacing:-0.3px; }
button { font-family:inherit; cursor:pointer; }
.hidden { display:none !important; }

/* topbar */
.top { position:sticky; top:0; z-index:20; height:62px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 20px; gap:12px; }
.brand { display:flex; align-items:center; gap:10px; cursor:pointer; min-width:0; }
.logo { width:36px; height:36px; border-radius:10px; flex-shrink:0; background:linear-gradient(135deg,var(--p),var(--p2)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Bricolage Grotesque'; font-weight:800; }
.bn { font-family:'Bricolage Grotesque'; font-weight:800; font-size:.95rem; line-height:1.1; }
.bs { font-size:.6rem; color:#94a3b8; margin-top:2px; }
.who { display:flex; align-items:center; gap:10px; font-size:.78rem; font-weight:700; }
.who .av { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--p),var(--p2)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.7rem; }
.btn { padding:9px 16px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-size:.8rem; font-weight:700; color:#374151; transition:.15s; }
.btn:hover { border-color:var(--p); color:var(--p); }
.btn.pri { background:linear-gradient(135deg,var(--p),var(--p2)); color:#fff; border:0; box-shadow:0 6px 16px rgba(79,70,229,.3); }
.btn.pri:hover { color:#fff; transform:translateY(-1px); }
.btn.ok { background:var(--ok); color:#fff; border:0; }
.btn[disabled] { opacity:.4; pointer-events:none; }

.demo { background:#FEF3C7; color:#92400E; font-size:.72rem; font-weight:600; text-align:center; padding:7px 14px; }
main { max-width:1040px; margin:0 auto; padding:26px 20px 60px; }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; }

/* beranda */
.hero { background:linear-gradient(135deg,#1e1b4b,#4F46E5 60%,#7C3AED); color:#fff; border-radius:22px; padding:34px 28px; margin-bottom:22px; position:relative; overflow:hidden; }
.hero h1 { font-size:1.7rem; line-height:1.15; margin-bottom:8px; }
.hero p { font-size:.88rem; opacity:.85; max-width:520px; line-height:1.55; }
.hero:after { content:''; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.08); }
.pick { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.pickc { text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:18px; padding:22px; transition:.2s; display:flex; gap:16px; align-items:center; }
.pickc:hover { border-color:var(--p); box-shadow:0 10px 26px rgba(79,70,229,.12); transform:translateY(-2px); }
.pickc .ic { width:54px; height:54px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:1.6rem; flex-shrink:0; }
.pickc b { font-family:'Bricolage Grotesque'; font-size:1.05rem; display:block; margin-bottom:3px; }
.pickc span { font-size:.76rem; color:var(--mut); line-height:1.45; }

/* form login */
.login { max-width:400px; margin:30px auto; }
.login h2 { font-size:1.3rem; margin-bottom:4px; }
.login p.s { font-size:.8rem; color:var(--mut); margin-bottom:18px; line-height:1.5; }
label.f { display:block; font-size:.72rem; font-weight:700; color:#374151; margin:12px 0 5px; }
input.i, select.i { width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; font-size:.9rem; background:#fff; outline:none; }
input.i:focus, select.i:focus { border-color:var(--p); box-shadow:0 0 0 3px rgba(79,70,229,.12); }

/* section header */
.sh { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.sh h2 { font-size:1.25rem; }
.sub { font-size:.78rem; color:var(--mut); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
.ex { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:10px; }
.ex .tag { align-self:flex-start; font-size:.62rem; font-weight:800; padding:3px 9px; border-radius:20px; }
.t-f { background:#FEF3C7; color:#92400E; } .t-s { background:#D1FAE5; color:#065F46; } .t-j { background:#DBEAFE; color:#1E40AF; } .t-t { background:#F3E8FF; color:#6B21A8; }
.ex h3 { font-size:.98rem; }
.meta { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.72rem; color:var(--mut); }
.stat { font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:20px; align-self:flex-start; }
.st-open { background:#D1FAE5; color:#065F46; } .st-done { background:#E0E7FF; color:#3730A3; } .st-soon { background:#F1F5F9; color:#64748b; }

/* tabs & filter */
.tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; }
.tab { padding:9px 16px; border-radius:11px; border:1.5px solid var(--line); background:#fff; font-size:.8rem; font-weight:700; color:#374151; white-space:nowrap; }
.tab.on { background:linear-gradient(135deg,var(--p),var(--p2)); color:#fff; border-color:transparent; }
.filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
.sub-tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.stab { padding:7px 14px; border-radius:20px; border:1.5px solid var(--line); background:#fff; font-size:.74rem; font-weight:700; color:var(--mut); }
.stab.on { border-color:var(--p); color:var(--p); background:#EEF2FF; }
table { width:100%; border-collapse:collapse; font-size:.8rem; }
th { text-align:left; font-size:.66rem; text-transform:uppercase; letter-spacing:.5px; color:var(--mut); padding:9px 10px; border-bottom:1.5px solid var(--line); }
td { padding:11px 10px; border-bottom:1px solid #F1F0F9; vertical-align:top; }
.tw { overflow-x:auto; }
.ty { font-size:.64rem; font-weight:800; padding:2px 8px; border-radius:6px; background:#EEF2FF; color:var(--p); white-space:nowrap; }
.empty { text-align:center; padding:34px 10px; color:var(--mut); font-size:.85rem; }

/* ruang ujian */
.room { position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column; }
.rtop { background:#fff; border-bottom:1px solid var(--line); padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.rtop h3 { font-size:.95rem; } .rtop small { color:var(--mut); font-size:.7rem; }
.timer { font-family:'Bricolage Grotesque'; font-weight:800; font-size:1.15rem; padding:7px 14px; border-radius:11px; background:#EEF2FF; color:var(--p); font-variant-numeric:tabular-nums; }
.timer.low { background:#FEE2E2; color:var(--bad); }
.pbar { height:5px; background:#E5E7EB; } .pbar i { display:block; height:100%; background:linear-gradient(90deg,var(--p),var(--p2)); transition:width .3s; }
.rbody { flex:1; overflow:auto; display:grid; grid-template-columns:1fr 250px; gap:18px; padding:20px; max-width:1100px; width:100%; margin:0 auto; align-items:start; }
.qcard { background:#fff; border:1px solid var(--line); border-radius:18px; padding:24px; }
.qh { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.qn { font-family:'Bricolage Grotesque'; font-weight:800; font-size:.95rem; }
.qt { font-size:1rem; line-height:1.65; margin-bottom:18px; font-weight:500; }
.hint { font-size:.74rem; color:var(--mut); margin-bottom:12px; font-style:italic; }
.opt { display:flex; gap:12px; align-items:flex-start; padding:13px 15px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:9px; cursor:pointer; transition:.15s; font-size:.92rem; line-height:1.5; }
.opt:hover { border-color:#A5B4FC; }
.opt.sel { border-color:var(--p); background:#EEF2FF; }
.opt .k { width:26px; height:26px; border-radius:8px; background:#F1F5F9; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.76rem; flex-shrink:0; }
.opt.sel .k { background:var(--p); color:#fff; }
.opt.chk .k { border-radius:7px; }
.bsr { display:grid; grid-template-columns:1fr 64px 64px; gap:8px; align-items:center; padding:11px 0; border-bottom:1px solid #F1F0F9; font-size:.9rem; line-height:1.5; }
.bsr.hd { font-size:.66rem; font-weight:800; text-transform:uppercase; color:var(--mut); padding:4px 0; }
.bsb { padding:8px 0; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-weight:800; font-size:.78rem; }
.bsb.on { background:var(--p); color:#fff; border-color:var(--p); }
textarea.i { width:100%; min-height:150px; padding:13px; border:1.5px solid var(--line); border-radius:12px; font-family:inherit; font-size:.92rem; line-height:1.6; resize:vertical; outline:none; }
textarea.i:focus { border-color:var(--p); box-shadow:0 0 0 3px rgba(79,70,229,.12); }
.qnav { display:flex; justify-content:space-between; gap:10px; margin-top:20px; flex-wrap:wrap; }
.side { background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px; position:sticky; top:0; }
.side h4 { font-size:.78rem; margin-bottom:10px; }
.nums { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
.nb { aspect-ratio:1; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-weight:800; font-size:.78rem; color:#64748b; position:relative; }
.nb.ans { background:var(--p); border-color:var(--p); color:#fff; }
.nb.rag { background:var(--warn); border-color:var(--warn); color:#fff; }
.nb.cur { outline:3px solid rgba(79,70,229,.35); outline-offset:1px; }
.lg { display:flex; flex-direction:column; gap:5px; margin-top:12px; font-size:.68rem; color:var(--mut); }
.lg span:before { content:''; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:7px; vertical-align:-1px; }
.l1:before { background:var(--p); } .l2:before { background:var(--warn); } .l3:before { border:1.5px solid var(--line); }
.modal { position:fixed; inset:0; z-index:90; background:rgba(15,23,42,.55); display:flex; align-items:center; justify-content:center; padding:20px; }
.mbox { background:#fff; border-radius:20px; padding:26px; max-width:400px; width:100%; }
.mbox h3 { font-size:1.15rem; margin-bottom:8px; } .mbox p { font-size:.85rem; color:var(--mut); line-height:1.55; margin-bottom:18px; }
.mrow { display:flex; gap:10px; justify-content:flex-end; }

/* rapor */
.rapor { background:#fff; border:1px solid var(--line); border-radius:18px; padding:30px; }
.rh { text-align:center; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:18px; }
.rh h2 { font-size:1.25rem; } .rh p { font-size:.78rem; color:var(--mut); margin-top:3px; }
.idg { display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; font-size:.82rem; margin-bottom:20px; }
.idg div b { display:inline-block; min-width:96px; color:var(--mut); font-weight:600; }
.score { display:flex; align-items:center; gap:18px; background:linear-gradient(135deg,#EEF2FF,#F5F3FF); border-radius:16px; padding:18px 22px; margin-bottom:20px; flex-wrap:wrap; }
.big { font-family:'Bricolage Grotesque'; font-size:2.6rem; font-weight:800; color:var(--p); line-height:1; }
.bar { height:9px; border-radius:6px; background:#E5E7EB; overflow:hidden; min-width:90px; } .bar i { display:block; height:100%; border-radius:6px; }
.pill { font-size:.66rem; font-weight:800; padding:3px 10px; border-radius:20px; white-space:nowrap; }
.p-ok { background:#D1FAE5; color:#065F46; } .p-mid { background:#FEF3C7; color:#92400E; } .p-low { background:#FEE2E2; color:#991B1B; }
.note { background:#F8FAFC; border-left:4px solid var(--p); padding:13px 16px; border-radius:0 10px 10px 0; font-size:.84rem; line-height:1.6; margin-top:18px; }
.rapor h3 { font-size:.95rem; margin:20px 0 8px; }
.ttd { display:flex; justify-content:space-between; margin-top:34px; font-size:.78rem; text-align:center; }
.ttd div { width:42%; } .ttd u { display:block; margin-top:56px; font-weight:700; text-decoration:none; border-top:1px solid #000; padding-top:4px; }

@media (max-width:760px) {
  main { padding:18px 14px 50px; }
  .pick { grid-template-columns:1fr; }
  .rbody { grid-template-columns:1fr; padding:12px; }
  .side { position:static; order:-1; }
  .nums { grid-template-columns:repeat(10,1fr); gap:5px; }
  .qcard { padding:18px; }
  .hero h1 { font-size:1.35rem; }
  .idg { grid-template-columns:1fr; }
  .who span.nm { display:none; }
  .rapor { padding:18px 12px; }
  .rapor td, .rapor th { padding:9px 5px; font-size:.74rem; }
  .rapor .bar { min-width:48px; }
  .rapor .pill { font-size:.58rem; padding:3px 7px; white-space:normal; }
}
details.dt { border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:8px; background:#fff; }
details.dt summary { cursor:pointer; font-size:.84rem; line-height:1.5; list-style:none; display:flex; gap:10px; align-items:flex-start; }
details.dt summary::-webkit-details-marker { display:none; }
.dtb { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:.8rem; line-height:1.6; color:#334155; }
.dtb .kn { color:#065F46; font-weight:700; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:120; background:#0F172A; color:#fff; padding:11px 18px; border-radius:12px; font-size:.82rem; max-width:90vw; box-shadow:0 10px 30px rgba(0,0,0,.25); }
.toast.err { background:#B91C1C; }
.save { font-size:.68rem; color:var(--mut); } .save.bad { color:var(--bad); font-weight:700; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .row3 { display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; }
.pinbox { font-family:monospace; font-weight:800; letter-spacing:2px; }
.spin { text-align:center; padding:50px 10px; color:var(--mut); font-size:.85rem; }
.numin { width:80px; padding:7px 9px; border:1.5px solid var(--line); border-radius:9px; font-family:inherit; font-size:.85rem; }
.jwb { background:#F8FAFC; border-radius:10px; padding:10px 12px; font-size:.84rem; line-height:1.55; white-space:pre-wrap; margin:6px 0; }
@media (max-width:760px){ .row2,.row3 { grid-template-columns:1fr; } }
#mN::placeholder { color:#9AA3AF; font-weight:300; opacity:1; }
#areaCetak { display:none; }
.kartu-judul { display:none; font-weight:800; font-size:1.05rem; margin:0 0 10px; }
@media print {
  body.cetak-kartu > *:not(#areaCetak) { display:none !important; }
  body.cetak-kartu #areaCetak { display:block !important; padding:12mm; }
  body.cetak-kartu .kartu { border:1.5px solid #000 !important; box-shadow:none; margin:0 !important; }
  body.cetak-kartu .kartu .sh h3 { display:none; }
  body.cetak-kartu .kartu-judul { display:block; }
  .top, .demo, .noprint { display:none !important; }
  body { background:#fff; } main { padding:0; max-width:none; }
  .rapor { border:0; padding:0; }
}
</style>
</head>
<body>

<div class="top noprint">
  <div class="brand" onclick="go('/')">
    <div class="logo">A</div>
    <div><div class="bn">Cipta Guru Asesmen</div><div class="bs">asesmen.ciptaguru.com</div></div>
  </div>
  <div class="who hidden" id="who">
    <div class="av" id="whoAv">AN</div><span class="nm" id="whoNm"></span>
    <button class="btn" onclick="keluar()">Keluar</button>
  </div>
</div>

<main id="app"></main>

<script>
const SB_URL = 'https://geabugomvgsgemlmxggx.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlYWJ1Z29tdmdzZ2VtbG14Z2d4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzU1NTgsImV4cCI6MjEwMTY1MTU1OH0.1dReCnfV-u45mqo1__AD7NNwjRQUWuPzV3WX1RRliZE';

/* ════════ KONSTANTA ════════ */
const JENIS = {
  formatif: { n:'Asesmen Formatif', ic:'📝', d:'Penilaian proses belajar' },
  sumatif:  { n:'Asesmen Sumatif', ic:'📊', d:'Penilaian akhir lingkup materi' },
  jenjang:  { n:'Asesmen Akhir Jenjang', ic:'🎓', d:'Penilaian akhir jenjang' },
  tahun:    { n:'Asesmen Akhir Tahun', ic:'🗓️', d:'Penilaian akhir tahun ajaran' }
};
const TIPE = { PG:'Pilihan Ganda', PK:'Pilihan Kompleks', BS:'Benar/Salah', ES:'Esai Pendek', EP:'Esai Panjang' };
const TAGCLS = { formatif:'t-f', sumatif:'t-s', jenjang:'t-j', tahun:'t-t' };

/* ════════ BANTU ════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ss(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch(e){} return null; }
function toast(msg, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3800); }
async function rpc(name, args){
  let res;
  try { res = await fetch(SB_URL + '/rest/v1/rpc/' + name, { method:'POST', headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(args || {}) }); }
  catch(e){ throw new Error('Tidak ada koneksi internet'); }
  let data = null; try { data = await res.json(); } catch(e){}
  if (!res.ok) {
    const m = (data && (data.message || data.hint)) || 'Terjadi kesalahan';
    if (/Sesi login habis/.test(m)) { keluar(true); }
    throw new Error(m);
  }
  return data;
}
function loading(app, t){ app.innerHTML = '<div class="spin">'+(t||'Memuat...')+'</div>'; }
function fmt(s){ const m=Math.floor(s/60), d=s%60; return String(m).padStart(2,'0')+':'+String(d).padStart(2,'0'); }
function tglIndo(iso){ try { return new Date(iso).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); } catch(e){ return ''; } }

/* ════════ STATE ════════ */
const S = {
  peran: ss('as_peran'), nama: ss('as_nama') || '', kelas: +ss('as_kelas') || 0, kode: ss('as_kode') || '',
  token: ss('as_token'), pc: ss('as_pc'),
  jenis: 'formatif', gTab: 'bank', ujianKode: ss('as_ujian') || ''
};
const R = { soal:[], jaw:{}, rag:{}, cur:0, perc:null, sisa:0, timer:null, dirty:{}, saver:null, judul:'', mapel:'', jenis:'formatif', kelas:0 };
const G = { combos:[], fM:'', fK:'', fT:'', bank:null, siswaK:'', hasilKode:'' };

/* ════════ ROUTER ════════ */
function go(p){ location.hash = '#' + p; }
window.addEventListener('hashchange', render);
function keluar(diam){
  clearInterval(R.timer); clearTimeout(R.saver); const r=$('room'); if (r) r.remove();
  ['as_peran','as_nama','as_kelas','as_kode','as_token','as_pc','as_ujian'].forEach(k=>ss(k,null));
  S.peran=null; S.token=null; S.pc=null; S.nama=''; S.ujianKode='';
  if (diam !== true) go('/'); else { go('/murid-login'); render(); }
}
function ambilJenisDariUrl(){ const j = new URLSearchParams(location.search).get('jenis'); if (j && JENIS[j]) S.jenis = j; }

async function render(){
  const path = location.hash.replace('#','') || '/';
  const app = $('app'), who = $('who');
  if (S.peran){ who.classList.remove('hidden'); $('whoNm').textContent = S.nama;
    $('whoAv').textContent = S.nama.split(' ').filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase() || '?'; }
  else who.classList.add('hidden');
  if (!path.startsWith('/ujian')) { const r=$('room'); if (r) r.remove(); }
  try {
    if (path === '/') return beranda(app);
    if (path === '/murid-login') return muridLogin(app);
    if (path === '/guru-login') return guruLogin(app);
    if (path === '/murid') return S.peran==='murid' ? await muridHome(app) : go('/murid-login');
    if (path === '/ujian') return S.peran==='murid' ? await ruangMulai() : go('/murid-login');
    if (path.startsWith('/rapor/')) return S.peran==='murid' ? await rapor(app, path.split('/')[2], false) : go('/murid-login');
    if (path === '/guru') return S.peran==='guru' ? await guruHome(app) : go('/guru-login');
    if (path.startsWith('/guru-rapor/')) return S.peran==='guru' ? await rapor(app, path.split('/')[2], true) : go('/guru-login');
    go('/');
  } catch(e){ toast(e.message, true); if (S.peran==='murid' && path!=='/murid') go('/murid'); }
}

/* ════════ RUANG UJIAN ════════ */
async function mulaiUjian(kode){
  kode = (kode||'').trim().toUpperCase();
  if (kode.length < 6) { toast('Masukkan kode sesi 6 karakter', true); return; }
  try {
    const r = await rpc('as_murid_mulai', { p_token: S.token, p_kode: kode });
    if (!r.ok) { toast(r.pesan, true); if (r.selesai) go('/rapor/'+r.percobaan); return; }
    siapkanRuang(r); S.ujianKode = kode; ss('as_ujian', kode);
    if (location.hash === '#/ujian') render(); else go('/ujian');
  } catch(e){ toast(e.message, true); }
}
async function ruangMulai(){
  if (R.perc && R.soal.length) return ruang();          // sudah ada di memori
  if (!S.ujianKode) return go('/murid');
  const r = await rpc('as_murid_mulai', { p_token: S.token, p_kode: S.ujianKode });
  if (!r.ok) { toast(r.pesan, true); return go('/murid'); }
  siapkanRuang(r); ruang();
}
function siapkanRuang(r){
  clearInterval(R.timer); clearTimeout(R.saver);
  R.soal = r.soal; R.perc = r.percobaan; R.sisa = r.sisa; R.judul = r.judul; R.mapel = r.mapel; R.jenis = r.jenis; R.kelas = r.kelas;
  R.cur = 0; R.dirty = {}; R.rag = {}; R.jaw = {};
  R.soal.forEach(s => { const a = (r.jawaban||{})[s.id];
    R.jaw[s.id] = s.tipe==='PK' ? (Array.isArray(a)?a:[]) : s.tipe==='BS' ? (Array.isArray(a)?a:[null,null,null,null]) : (a==null ? (s.tipe==='PG'?null:'') : a); });
  R.timer = setInterval(() => { R.sisa--; if (R.sisa <= 0) { clearInterval(R.timer); kumpul(true); } else tick(); }, 1000);
}
function tick(){ const t=$('tm'); if (t){ t.textContent = fmt(R.sisa); t.classList.toggle('low', R.sisa<300); } }
function terjawab(s){ const a = R.jaw[s.id];
  if (s.tipe==='PG') return a!=null; if (s.tipe==='PK') return a.length>0; if (s.tipe==='BS') return a.every(x=>x!=null); return String(a).trim().length>0; }
function tandai(sid){ R.dirty[sid]=true; setSave('Menyimpan...'); clearTimeout(R.saver); R.saver = setTimeout(simpan, 1200); }
function setSave(t, bad){ const e=$('saveInfo'); if (e){ e.textContent=t; e.className='save'+(bad?' bad':''); } }
async function simpan(){
  const ids = Object.keys(R.dirty); if (!ids.length || !R.perc) return;
  const paket = {}; ids.forEach(i => paket[i] = R.jaw[i]); R.dirty = {};
  try { await rpc('as_murid_simpan', { p_token: S.token, p_perc: R.perc, p_jawab: paket }); setSave('Tersimpan ✓'); }
  catch(e){ ids.forEach(i => R.dirty[i]=true); setSave('Belum tersimpan, mencoba lagi...', true); clearTimeout(R.saver); R.saver = setTimeout(simpan, 5000); }
}
function ruang(){
  let box = $('room');
  if (!box){ box=document.createElement('div'); box.id='room'; box.className='room'; document.body.appendChild(box); }
  const s = R.soal[R.cur], n = R.soal.length, done = R.soal.filter(terjawab).length, a = R.jaw[s.id]; let isi = '';
  if (s.tipe==='PG') isi = s.opsi.map((o,i)=>`<div class="opt ${a==='ABCD'[i]?'sel':''}" onclick="pilih(${i})"><div class="k">${'ABCD'[i]}</div><div>${esc(o)}</div></div>`).join('');
  if (s.tipe==='PK') isi = '<div class="hint">Pilih lebih dari satu jawaban yang benar.</div>' + s.opsi.map((o,i)=>`<div class="opt chk ${a.includes('ABCDE'[i])?'sel':''}" onclick="pilih(${i})"><div class="k">${a.includes('ABCDE'[i])?'✓':'ABCDE'[i]}</div><div>${esc(o)}</div></div>`).join('');
  if (s.tipe==='BS') isi = '<div class="bsr hd"><div>Pernyataan</div><div style="text-align:center">Benar</div><div style="text-align:center">Salah</div></div>' +
     s.opsi.map((p,i)=>`<div class="bsr"><div>${i+1}. ${esc(p)}</div><button class="bsb ${a[i]==='B'?'on':''}" onclick="jwbBS(${i},'B')">B</button><button class="bsb ${a[i]==='S'?'on':''}" onclick="jwbBS(${i},'S')">S</button></div>`).join('');
  if (s.tipe==='ES' || s.tipe==='EP') isi = `<textarea class="i" id="esai" placeholder="Tulis jawabanmu di sini..." oninput="jwbEsai(this.value)">${esc(a)}</textarea><div class="hint" style="margin-top:8px">Jawaban tersimpan otomatis.</div>`;
  box.innerHTML = `
  <div class="rtop"><div><h3>${esc(R.judul)}</h3><small>${esc(R.mapel)} · Kelas ${R.kelas} · ${esc(S.nama)} · <span class="save" id="saveInfo"></span></small></div><div class="timer ${R.sisa<300?'low':''}" id="tm">${fmt(R.sisa)}</div></div>
  <div class="pbar"><i style="width:${done/n*100}%"></i></div>
  <div class="rbody"><div class="qcard">
    <div class="qh"><span class="qn">Soal ${R.cur+1} dari ${n}</span><span class="ty">${TIPE[s.tipe]}</span>
      <button class="btn" style="margin-left:auto;padding:6px 12px;font-size:.72rem;${R.rag[s.id]?'background:#FEF3C7;border-color:#F59E0B;color:#92400E':''}" onclick="R.rag[${s.id}]=!R.rag[${s.id}];ruang()">🚩 Ragu-ragu</button></div>
    <div class="qt">${esc(s.teks)}</div>${isi}
    <div class="qnav"><button class="btn" ${R.cur===0?'disabled':''} onclick="R.cur--;ruang()">← Sebelumnya</button>
      ${R.cur<n-1 ? '<button class="btn pri" onclick="R.cur++;ruang()">Berikutnya →</button>' : '<button class="btn ok" onclick="konfirm()">Selesai &amp; Kumpulkan</button>'}</div></div>
    <div class="side"><h4>Navigasi Soal</h4>
      <div class="nums">${R.soal.map((x,i)=>`<button class="nb ${terjawab(x)?'ans':''} ${R.rag[x.id]?'rag':''} ${i===R.cur?'cur':''}" onclick="R.cur=${i};ruang()">${i+1}</button>`).join('')}</div>
      <div class="lg"><span class="l1">Sudah dijawab</span><span class="l2">Ragu-ragu</span><span class="l3">Belum dijawab</span></div>
      <button class="btn ok" style="width:100%;margin-top:16px" onclick="konfirm()">Kumpulkan</button></div></div>`;
}
function pilih(i){ const s=R.soal[R.cur];
  if (s.tipe==='PG') R.jaw[s.id] = 'ABCD'[i];
  else { const h='ABCDE'[i], a=R.jaw[s.id], x=a.indexOf(h); x>=0 ? a.splice(x,1) : a.push(h); a.sort(); }
  tandai(s.id); ruang(); }
function jwbBS(i,v){ const s=R.soal[R.cur]; R.jaw[s.id][i]=v; tandai(s.id); ruang(); }
function jwbEsai(v){ const s=R.soal[R.cur]; R.jaw[s.id]=v; tandai(s.id);
  const done=R.soal.filter(terjawab).length; const pb=document.querySelector('.pbar i'); if (pb) pb.style.width=(done/R.soal.length*100)+'%';
  document.querySelectorAll('.nb').forEach((b,i)=>b.classList.toggle('ans', terjawab(R.soal[i]))); }
function konfirm(){
  const b = R.soal.filter(s=>!terjawab(s)).length;
  const m=document.createElement('div'); m.className='modal'; m.id='mdl';
  m.innerHTML = `<div class="mbox"><h3>Kumpulkan jawaban?</h3><p>${b?`Masih ada <b>${b} soal</b> yang belum dijawab. `:'Semua soal sudah dijawab. '}Setelah dikumpulkan, jawaban tidak bisa diubah.</p>
    <div class="mrow"><button class="btn" onclick="$('mdl').remove()">Kembali</button><button class="btn ok" onclick="kumpul()">Ya, kumpulkan</button></div></div>`;
  document.body.appendChild(m);
}
async function kumpul(habis){
  clearInterval(R.timer); clearTimeout(R.saver);
  const m=$('mdl'); if (m) m.remove();
  const paket = {}; R.soal.forEach(s => paket[s.id] = R.jaw[s.id]);
  try {
    await rpc('as_murid_kumpul', { p_token: S.token, p_perc: R.perc, p_jawab: paket });
    const id = R.perc; R.perc = null; R.soal = []; S.ujianKode=''; ss('as_ujian', null);
    if (habis) toast('Waktu habis. Jawabanmu sudah dikumpulkan.');
    go('/rapor/'+id);
  } catch(e){ toast(e.message + ' — coba tekan Kumpulkan lagi', true);
    R.timer = setInterval(()=>{ R.sisa--; tick(); }, 1000); }
}

/* ════════ RAPOR (murid & guru) ════════ */

}
const mapelList = () => [...new Set(G.combos.map(c=>c.mapel))];
const kelasDari = m => G.combos.filter(c=>c.mapel===m).map(c=>c.kelas);

async function gBank(body){
  const kls = G.fM ? kelasDari(G.fM) : [1,2,3,4,5,6];
  body.innerHTML = `<div class="filters">
    <select class="i" onchange="G.fM=this.value;G.fK='';G.bank=null;render()"><option value="">Pilih Mata Pelajaran</option>${mapelList().map(m=>`<option ${G.fM===m?'selected':''}>${esc(m)}</option>`).join('')}</select>
    <select class="i" onchange="G.fK=this.value;G.bank=null;render()"><option value="">Semua Kelas</option>${kls.map(k=>`<option value="${k}" ${G.fK==k?'selected':''}>Kelas ${k}</option>`).join('')}</select>
    <select class="i" onchange="G.fT=this.value;G.bank=null;render()"><option value="">Semua Jenis Soal</option>${Object.entries(TIPE).map(([k,v])=>`<option value="${k}" ${G.fT===k?'selected':''}>${v}</option>`).join('')}</select></div><div id="bankList"></div>`;
  const L = $('bankList');
  if (!G.fM) { L.innerHTML = '<div class="empty card">Pilih mata pelajaran dulu untuk melihat soal.</div>'; return; }
  loading(L);
  const list = await rpc('as_guru_soal', { p_passcode:S.pc, p_jenis:'formatif', p_mapel:G.fM, p_kelas: G.fK?+G.fK:null, p_tipe:G.fT||null });
  L.innerHTML = `<div class="sub" style="margin-bottom:10px">${list.length} soal. Kunci dan pembahasan hanya terlihat oleh guru.</div>` +
    (list.length ? list.map(b => {
      let op = ''; if (b.opsi) op = '<ol type="A" style="margin:6px 0 8px 18px">' + b.opsi.map(o=>`<li>${esc(o)}</li>`).join('') + '</ol>';
      return `<details class="dt"><summary><span class="ty">${b.tipe}</span><span><b>K${b.kelas} · ${esc(b.tp)}</b> — ${esc(b.teks)}</span></summary>
        <div class="dtb">${op}<div><span class="kn">Kunci:</span> ${esc(b.kunci)} &nbsp;·&nbsp; Skor maks ${b.maks}</div><div style="margin-top:6px">${esc(b.pembahasan)}</div>
        <div class="sub" style="margin-top:6px">${esc(b.tp_nama)}</div></div></details>`; }).join('') : '<div class="empty card">Tidak ada soal untuk filter ini.</div>');
}

async function gSesi(body){
  const ul = await rpc('as_guru_ujian_list', { p_passcode:S.pc, p_jenis:'formatif' });
  const opsiM = mapelList().map(m=>`<option>${esc(m)}</option>`).join('');
  body.innerHTML = `
  <div class="card" style="margin-bottom:18px"><h3 style="font-size:1rem;margin-bottom:6px">Buat Sesi Ujian</h3>
    <div class="sub">Sesi baru berstatus draft. Klik Buka kalau murid sudah boleh mengerjakan.</div>
    <div class="row3" style="margin-top:6px"><div><label class="f">Mata Pelajaran</label><select class="i" id="sM" onchange="isiKelasSesi()">${opsiM}</select></div>
      <div><label class="f">Kelas</label><select class="i" id="sK"></select></div>
      <div><label class="f">Durasi (menit)</label><input class="i" id="sD" type="number" value="60" min="5" max="240"></div></div>
    <label class="f">Judul Sesi</label><input class="i" id="sJ" placeholder="contoh: Formatif Bab 1 Bilangan">
    <button class="btn pri" style="margin-top:14px" onclick="buatSesi()">+ Buat Sesi</button></div>
  ${ul.length ? '<div class="grid">'+ul.map(u=>`<div class="ex"><span class="tag t-f">Formatif</span><h3>${esc(u.mapel)} K${u.kelas}: ${esc(u.judul)}</h3>
    <div style="font-size:.7rem;color:var(--mut)">Kode sesi untuk murid</div><div class="disp" style="font-size:1.7rem;letter-spacing:3px;color:var(--p)">${u.kode}</div>
    <div class="meta"><span>⏱ ${u.durasi} menit</span><span>❓ ${u.jumlah_soal} soal</span><span>👥 ${u.murid} murid</span><span>✍ ${u.selesai}/${u.mulai} selesai</span></div>
    <span class="stat ${u.status==='buka'?'st-open':u.status==='tutup'?'st-done':'st-soon'}">${u.status==='buka'?'Dibuka':u.status==='tutup'?'Ditutup':'Draft'}</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${u.status!=='buka'?`<button class="btn pri" onclick="ubahSesi('${u.kode}','buka')">${u.status==='tutup'?'Buka Lagi':'Buka'}</button>`:`<button class="btn" onclick="ubahSesi('${u.kode}','tutup')">Tutup Sesi</button>`}
    <button class="btn" onclick="G.hasilKode='${u.kode}';S.gTab='hasil';render()">Hasil</button></div></div>`).join('')+'</div>' : '<div class="empty card">Belum ada sesi. Buat sesi pertamamu di atas.</div>'}`;
  isiKelasSesi();
}
function isiKelasSesi(){ const m=$('sM').value; $('sK').innerHTML = kelasDari(m).map(k=>`<option value="${k}">Kelas ${k}</option>`).join(''); }
async function buatSesi(){
  try { const r = await rpc('as_guru_ujian_buat', { p_passcode:S.pc, p_jenis:'formatif', p_mapel:$('sM').value, p_kelas:+$('sK').value, p_judul:$('sJ').value, p_durasi:+$('sD').value||60 });
    toast('Sesi dibuat. Kodenya: '+r.kode); render(); } catch(e){ toast(e.message, true); }
}
async function ubahSesi(kode, st){ try { await rpc('as_guru_ujian_status', { p_passcode:S.pc, p_kode:kode, p_status:st }); toast(st==='buka'?'Sesi dibuka':'Sesi ditutup'); render(); } catch(e){ toast(e.message, true); } }

async function gMurid(body){
  const kls = '<option value="">Semua Kelas</option>' + [1,2,3,4,5,6].map(k=>`<option value="${k}" ${G.siswaK==k?'selected':''}>Kelas ${k}</option>`).join('');
  body.innerHTML = `
  <div class="card" style="margin-bottom:18px"><h3 style="font-size:1rem;margin-bottom:6px">Tambah Murid</h3>
    <div class="sub">Pilih kelas, ketik satu nama murid, lalu tekan Tambahkan. Kode siswa dan PIN dibuatkan otomatis. PIN hanya tampil sekali, jadi cetak atau catat.</div>
    <div class="row2" style="margin-top:6px"><div><label class="f">Kelas</label><select class="i" id="mK">${[1,2,3,4,5,6].map(k=>`<option value="${k}" ${G.kelasTambah==k?'selected':''}>Kelas ${k}</option>`).join('')}</select></div><div></div></div>
    <label class="f">Nama Murid</label><input class="i" id="mN" type="text" maxlength="80" autocomplete="off" placeholder="ketik nama murid di sini" onkeydown="if(event.key==='Enter'){event.preventDefault();impor();}">
    <button class="btn pri" style="margin-top:12px" id="btnTambah" onclick="impor()">+ Tambahkan</button></div>
  <div id="hasilImpor"></div>
  <div class="sh"><div class="sub" id="jmlMurid">0 murid</div><select class="i" style="width:auto" onchange="G.siswaK=this.value;muatDaftar()">${kls}</select></div>
  <div class="card"><div class="tw"><table><thead><tr><th>Kode</th><th>Nama</th><th>Kelas</th><th></th></tr></thead><tbody id="daftarMurid"><tr><td colspan="4" class="empty">Memuat…</td></tr></tbody></table></div></div>`;
  await muatDaftar();
}
async function muatDaftar(){
  const list = await rpc('as_guru_siswa_list', { p_passcode:S.pc, p_kelas: G.siswaK?+G.siswaK:null });
  const jm = $('jmlMurid'), tb = $('daftarMurid'); if (!jm || !tb) return;
  jm.textContent = list.length + ' murid' + (G.siswaK ? ' (Kelas '+G.siswaK+')' : ' (semua kelas)');
  tb.innerHTML = list.length ? list.map(s=>`<tr><td class="pinbox">${esc(s.kode)}</td><td>${esc(s.nama)}</td><td>${s.kelas}</td>
      <td style="white-space:nowrap"><button class="btn" style="padding:5px 10px;font-size:.7rem" onclick="resetPin('${esc(s.kode)}')">Atur ulang PIN</button>
      <button class="btn" style="padding:5px 10px;font-size:.7rem;color:var(--bad)" onclick="hapusMurid('${esc(s.kode)}','${esc(s.nama).replace(/'/g,'')}')">Hapus</button></td></tr>`).join('') : '<tr><td colspan="4" class="empty">Belum ada murid.</td></tr>';
}
async function impor(){
  const nama = ($('mN').value || '').replace(/\s+/g,' ').trim(); const kelas = +$('mK').value;
  if (nama.length < 2) { toast('Ketik nama murid dulu', true); $('mN').focus(); return; }
  const btn = $('btnTambah'); btn.disabled = true;
  try { const r = await rpc('as_guru_siswa_impor', { p_passcode:S.pc, p_data: [{ nama, kelas }] });
    G.kelasTambah = kelas;
    $('hasilImpor').innerHTML = kartuLogin(r, 'Murid berhasil ditambahkan'); $('mN').value=''; $('mN').focus();
    await muatDaftar();
  } catch(e){ toast(e.message, true); }
  btn.disabled = false;
}
function cetakKartu(){
  const asal = document.querySelector('#hasilImpor .kartu'); if (!asal) return;
  const b = document.body; let area = document.getElementById('areaCetak');
  if (!area) { area = document.createElement('div'); area.id = 'areaCetak'; b.appendChild(area); }
  area.innerHTML = asal.outerHTML; b.classList.add('cetak-kartu');
  const selesai = () => { b.classList.remove('cetak-kartu'); area.innerHTML = ''; window.removeEventListener('afterprint', selesai); };
  window.addEventListener('afterprint', selesai);
  window.print();
}
function kartuLogin(r, judul){
  return `<div class="card kartu" style="margin-bottom:18px;border-color:var(--ok)"><div class="sh" style="margin-bottom:8px"><h3 style="font-size:1rem">✅ ${judul}</h3><button class="btn pri noprint" onclick="cetakKartu()">🖨 Cetak Kartu Ini</button></div>
   <div class="kartu-judul">Kartu Login Asesmen · Cipta Guru</div>
   <div class="tw"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Kode Siswa</th><th>PIN</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.nama)}</td><td>${x.kelas||''}</td><td class="pinbox">${esc(x.kode)}</td><td class="pinbox">${esc(x.pin)}</td></tr>`).join('')}</tbody></table></div>
   <div class="sub" style="margin-top:8px">Alamat ujian: <b>asesmen.ciptaguru.com</b> → pilih <b>Saya Murid</b>, lalu masukkan kode siswa dan PIN.</div>
   <div class="sub noprint" style="margin-top:6px">Catat PIN sekarang. PIN tidak bisa dilihat lagi nanti (hanya bisa diatur ulang).</div></div>`;
}
async function resetPin(kode){ try { const r = await rpc('as_guru_siswa_pin', { p_passcode:S.pc, p_kode:kode }); $('hasilImpor').innerHTML = kartuLogin([r], 'PIN baru dibuat'); window.scrollTo(0,0); } catch(e){ toast(e.message, true); } }
async function hapusMurid(kode, nama){ if (!confirm('Hapus murid '+nama+'? Nilainya ikut terhapus.')) return; try { await rpc('as_guru_siswa_hapus', { p_passcode:S.pc, p_kode:kode }); toast('Murid dihapus'); muatDaftar(); } catch(e){ toast(e.message, true); } }

async function gHasil(body){
  const ul = await rpc('as_guru_ujian_list', { p_passcode:S.pc, p_jenis:'formatif' });
  if (!ul.length) { body.innerHTML = '<div class="empty card">Belum ada sesi ujian.</div>'; return; }
  if (!G.hasilKode || !ul.some(u=>u.kode===G.hasilKode)) G.hasilKode = ul[0].kode;
  const h = await rpc('as_guru_hasil', { p_passcode:S.pc, p_kode:G.hasilKode });
  const sel = h.hasil.filter(x=>x.nilai!=null);
  const rata = sel.length ? Math.round(sel.reduce((a,x)=>a+x.nilai,0)/sel.length) : null;
  body.innerHTML = `<div class="filters"><select class="i" onchange="G.hasilKode=this.value;render()">${ul.map(u=>`<option value="${u.kode}" ${u.kode===G.hasilKode?'selected':''}>${esc(u.mapel)} K${u.kelas}: ${esc(u.judul)} (${u.kode})</option>`).join('')}</select></div>
  <div class="card"><div class="sub" style="margin-bottom:10px">${esc(h.ujian.mapel)} · Kelas ${h.ujian.kelas} · ${h.hasil.filter(x=>x.status==='selesai').length}/${h.hasil.length} sudah mengumpulkan${rata!=null?` · rata-rata <b>${rata}</b>`:''}.
    ${h.ujian.status==='tutup'?'':'Murid baru bisa melihat pembahasan setelah sesi ditutup.'}</div>
  <div class="tw"><table><thead><tr><th>Nama</th><th>Status</th><th>Nilai</th><th>Esai</th><th></th></tr></thead><tbody>
  ${h.hasil.length ? h.hasil.map(x=>`<tr><td>${esc(x.nama)}</td><td>${x.status==='selesai'?'<span class="pill p-ok">selesai</span>':x.status==='berjalan'?'<span class="pill p-mid">mengerjakan</span>':'<span class="pill p-low">belum mulai</span>'}</td>
    <td>${x.nilai==null?'–':x.nilai+(x.final?'':' (sementara)')}</td>
    <td>${x.status!=='selesai'?'':x.menunggu?`<span class="pill p-mid">${x.menunggu} perlu dinilai</span>`:'<span class="pill p-ok">sudah</span>'}</td>
    <td style="white-space:nowrap">${x.status==='selesai'?`<button class="btn" style="padding:5px 10px;font-size:.7rem" onclick="nilaiEsai('${x.percobaan}','${esc(x.nama).replace(/'/g,'')}')">Nilai Esai</button> <button class="btn" style="padding:5px 10px;font-size:.7rem" onclick="go('/guru-rapor/${x.percobaan}')">Rapor</button>`:''}</td></tr>`).join('') : '<tr><td colspan="5" class="empty">Belum ada murid di kelas ini. Tambahkan di tab Daftar Murid.</td></tr>'}</tbody></table></div></div><div id="esaiPanel"></div>`;
}
async function nilaiEsai(perc, nama){
  const P = $('esaiPanel'); loading(P);
  const es = await rpc('as_guru_esai', { p_passcode:S.pc, p_perc:perc });
  P.innerHTML = `<div class="card" style="margin-top:18px"><div class="sh" style="margin-bottom:8px"><h3 style="font-size:1rem">Nilai Esai: ${esc(nama)}</h3><button class="btn" onclick="$('esaiPanel').innerHTML=''">Tutup</button></div>
   ${es.map((e,i)=>`<div style="border-top:1px solid var(--line);padding:14px 0">
     <div style="font-size:.88rem;line-height:1.55"><span class="ty">${e.tipe}</span> <b>${esc(e.tp)}</b> — ${esc(e.teks)}</div>
     <div class="sub" style="margin-top:8px">Jawaban murid:</div><div class="jwb">${e.jawaban?esc(e.jawaban):'(tidak dijawab)'}</div>
     <div class="sub">Jawaban ideal: ${esc(e.kunci)}</div><div class="sub">Rubrik: ${esc(e.rubrik)}</div>
     <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="sub">Skor (maks ${e.maks}):</label>
       <input class="numin" id="es${i}" type="number" min="0" max="${e.maks}" step="0.5" value="${e.skor==null?'':e.skor}">
       <button class="btn pri" style="padding:7px 14px" onclick="simpanEsai('${perc}',${e.soal},${i},${e.maks})">Simpan</button><span class="save" id="esI${i}">${e.skor==null?'belum dinilai':'tersimpan'}</span></div></div>`).join('')}</div>`;
  P.scrollIntoView({ behavior:'smooth' });
}
async function simpanEsai(perc, soal, i, maks){
  const v = parseFloat($('es'+i).value); if (isNaN(v) || v<0 || v>maks) { toast('Skor harus antara 0 dan '+maks, true); return; }
  try { await rpc('as_guru_esai_nilai', { p_passcode:S.pc, p_perc:perc, p_soal:soal, p_skor:v }); $('esI'+i).textContent='tersimpan ✓'; } catch(e){ toast(e.message, true); }
}

render();
</script>
</body>
</html>
